<div class="pagination">
  <span class="step-links">
    {% if page.has_previous %}
      {% if query %}
        <a href="?query={{ query }}&page={{ page.previous_page_number }}">
      {% else %}
        <a href="?page={{ page.previous_page_number }}">
      {% endif %}
        Previous
      </a>
    {% endif %}
    <span class="current">
      Page {{ page.number }} of {{ page.paginator.num_pages }}.
    </span>
    {% if page.has_next %}
      {% if query %}
        <a href="?query={{ query }}&page={{ page.next_page_number }}">
      {% else %}
        <a href="?page={{ page.next_page_number }}">
      {% endif %}
        Next
      </a>
    {% endif %}
  </span>
</div>
