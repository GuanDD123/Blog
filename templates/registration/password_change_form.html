{% extends "base.html" %}

{% block title %}
Change your password
{% endblock %}

{% block content %}
<div id="content">
  <h1>Change your password</h1>
  <p>Use the form below to change your password.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">
      Change password
    </button>
  </form>
</div>
{% endblock %}
