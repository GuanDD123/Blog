{% extends "base.html" %}
{% load thumbnail %}

{% block title %}
People
{% endblock %}

{% block content %}
<div id="content">
  <h1>People</h1>
  <div id="people-list">
    {% for user in users %}
      <div class="user">
        <a href="{{ user.get_absolute_url }}">
          <img src="{% thumbnail user.profile.avatar 180x180 %}">
        </a>
        <div class="info">
          <a href="{{ user.get_absolute_url }}" class="title">
            {{ user.username }}
          </a>
        </div>
      </div>
    {% endfor %}
  </div>
  {% include "pagination.html" %}
</div>
{% endblock %}
