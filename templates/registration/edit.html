{% extends "base.html" %}

{% block title %}
Edit your account
{% endblock %}

{% block content %}
<div id="content">
  <h1>Edit your account</h1>
  <p>You can edit your account using the following form:</p>
  <form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ user_form.as_p }}
    {{ profile_form.as_p }}
    <button type="submit">
      Save changes
    </button>
  </form>
</div>
{% endblock %}
