{% extends "base.html" %}

{% block title %}
Create an account
{% endblock %}

{% block content %}
<div id="content">
  <h1>Create an account</h1>
  <p>Please, sign up using the following form:</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">
      Create my account
    </button>
  </form>
</div>
{% endblock %}
