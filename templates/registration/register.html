{% extends "registration/base.html" %}

{% block title %}
Create an account
{% endblock %}

{% block content %}
<h1>Create an account</h1>
<p>Please, sign up using the following form:</p>
<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <input type="submit" value="Create my account">
</form>
{% endblock %}
