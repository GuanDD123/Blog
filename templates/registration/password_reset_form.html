{% extends "base.html" %}

{% block title %}
Reset your password
{% endblock %}

{% block content %}
<div id="content">
  <h1>Forgotten your password?</h1>
  <p>Enter your e-mail address to obtain a new password.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">
      Send e-mail
    </button>
  </form>
</div>
{% endblock %}
