<h2>Add a new comment</h2>
<form action="{% url 'blog:post_comment' post.pk %}" method="post">
  {% csrf_token %}
  <div class="left">
    {{ form.name.as_field_group }}
  </div>
  <div class="left">
    {{ form.email.as_field_group }}
  </div>
  {{ form.content.as_field_group }}
  <p>
    <button type="submit">
      Add comment
    </button>
  </p>
</form>
