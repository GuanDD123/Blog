{% extends "base.html" %}

{% block title %}
Bookmark an image
{% endblock %}

{% block content %}
<div id="content">
  <h1>Bookmark an image</h1>
  <form method="get">
    {{ url_form.as_p }}
    <button type="submit">
      GO
    </button>
  </form>
  <hr>
  <img src="{{ request.GET.url }}" class="image-preview">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">
      Bookmark it!
    </button>
  </form>
</div>
{% endblock %}
